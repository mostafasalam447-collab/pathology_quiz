.opt.wrong::before{background:var(--red);border-color:var(--red);color:#fff;}

.q-feedback.wrong{background:#fef2f2;border-left:4px solid var(--red);color:#7f1d1d;}

.btn-re,.btn-home{width:100%;padding:14px;border:none;border-radius:14px;font-size:1.05em;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-bottom:10px;transition:all .2s;}

.review-section{text-align:left;margin-top:24px;}

/* لا توجد أسئلة صح/غلط في ملف المادة الجديدة — تم إبقاء النظام جاهزًا بدون بيانات */
const TF={};

/* شرح الإجابة = الإجابة الصحيحة كما هي محددة (بالتظليل الأخضر) في الملف */
ALL.forEach(q=>{q.exp='الإجابة الصحيحة: '+L[q.c].toLowerCase()+') '+q.opts[q.c];});

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let curCat='all', questions=[], answered=0, score=0, wrong=0;

function selCat(cat,btn){
  curCat=cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const n=cat==='all'?ALL.length:ALL.filter(q=>q.cat===cat).length;
  document.getElementById('qCount').textContent=n;
}
function startQuiz(){
  questions=curCat==='all'?[...ALL]:ALL.filter(q=>q.cat===curCat);
  answered=0;score=0;wrong=0;tfQuestions=[];totalQ=0;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('resultsBox').style.display='none';
  document.getElementById('quizWrapper').style.display='block';
  document.getElementById('stickyBar').style.display='block';
  renderCards();
  window.scrollTo({top:0});
}
function mkHdr(txt){
  const d=document.createElement('div');d.className='sec-hdr';
  d.innerHTML='<div class="line"></div><div class="lbl">'+txt+'</div><div class="line r"></div>';
  return d;
}
let tfQuestions=[], totalQ=0;

function buildTFQuestions(cats){
  tfQuestions=[];
  cats.forEach(cat=>{
    const d=TF[cat];if(!d)return;
    d.rows.forEach((r,ri)=>{
      tfQuestions.push({cat:cat,catTitle:d.title,idx:ri,stmt:r.s,ans:r.a,fix:r.fix||''});
    });
  });
}

function renderCards(){
  const c=document.getElementById('cardsContainer');c.innerHTML='';
  const cats=curCat==='all'?ORDER:[curCat];
  buildTFQuestions(cats);
  totalQ=questions.length+tfQuestions.length;
  answered=0;score=0;wrong=0;
  let gi=0, tfi=0;
  cats.forEach(cat=>{
    const cqs=questions.filter(q=>q.cat===cat);
    if(!cqs.length)return;
    c.appendChild(mkHdr(CATS[cat]+' — Choose Correct Answer'));
    cqs.forEach(q=>{
      const i=gi++;
      const card=document.createElement('div');
      card.className='q-card';card.id='card-mcq-'+i;
      card.style.animationDelay=Math.min(i*.018,.5)+'s';
      const oh=q.opts.map((o,li)=>'<button class="opt" data-orig="'+li+'" data-letter="'+L[li]+'" onclick="checkMCQ('+i+','+li+','+q.c+')">'+esc(o)+'</button>').join('');
      card.innerHTML='<div class="q-header"><div class="q-num">Q'+q.n+'</div><div class="cat-tag">'+CATS[q.cat]+'</div></div><div class="q-text">'+esc(q.q)+'</div><div class="opts" id="opts-mcq-'+i+'">'+oh+'</div><div class="q-feedback" id="fb-mcq-'+i+'"></div>';
      c.appendChild(card);
    });
    const tfCatItems=tfQuestions.filter(t=>t.cat===cat);
    if(tfCatItems.length){
      c.appendChild(mkHdr(CATS[cat]+' — True / False'));
      tfCatItems.forEach(t=>{
        const ti=tfi++;
        const card=document.createElement('div');
        card.className='q-card';card.id='card-tf-'+ti;
        card.style.animationDelay=Math.min((gi+ti)*.018,.5)+'s';
        const oh='<button class="opt" data-orig="1" data-letter="T" onclick="checkTF('+ti+',true,'+t.ans+')">True</button>'
                +'<button class="opt" data-orig="0" data-letter="F" onclick="checkTF('+ti+',false,'+t.ans+')">False</button>';
        card.innerHTML='<div class="q-header"><div class="q-num">TF'+(ti+1)+'</div><div class="cat-tag">'+t.catTitle+'</div></div><div class="q-text">'+esc(t.stmt)+'</div><div class="opts" id="opts-tf-'+ti+'">'+oh+'</div><div class="q-feedback" id="fb-tf-'+ti+'"></div>';
        c.appendChild(card);
      });
    }
  });
  updateSticky();
  document.getElementById('submitBtn').disabled=true;
}

function checkMCQ(qi,chosen,correct){
  const od=document.getElementById('opts-mcq-'+qi);
  if(od.querySelector('.correct,.wrong'))return;
  const ok=chosen===correct;
  Array.from(od.querySelectorAll('.opt')).forEach(b=>{
    b.disabled=true;
    if(+b.dataset.orig===correct)b.classList.add('correct');
    else if(+b.dataset.orig===chosen&&!ok)b.classList.add('wrong');
  });
  const fb=document.getElementById('fb-mcq-'+qi);
  fb.style.display='block';fb.className='q-feedback '+(ok?'correct':'wrong');
  fb.textContent=(ok?'✅ Correct! ':'❌ Wrong. ')+questions[qi].exp;
  document.getElementById('card-mcq-'+qi).classList.add(ok?'answered-correct':'answered-wrong');
  if(ok)score++;else wrong++;
  answered++;updateSticky();
  checkDone();
}

function checkTF(ti,chosen,correct){
  const od=document.getElementById('opts-tf-'+ti);
  if(od.querySelector('.correct,.wrong'))return;
  const ok=chosen===correct;
  Array.from(od.querySelectorAll('.opt')).forEach(b=>{
    b.disabled=true;
    const bVal=b.dataset.orig==='1';
    if(bVal===correct)b.classList.add('correct');
    else if(bVal===chosen&&!ok)b.classList.add('wrong');
  });
  const fb=document.getElementById('fb-tf-'+ti);
  const fix=tfQuestions[ti].fix?(' التصحيح: '+tfQuestions[ti].fix):'';
  fb.style.display='block';fb.className='q-feedback '+(ok?'correct':'wrong');
  fb.textContent=ok?('✅ Correct!'+(correct?'':fix)):'❌ Wrong. الإجابة الصحيحة: '+(correct?'True ✅':'False ❌')+fix;
  document.getElementById('card-tf-'+ti).classList.add(ok?'answered-correct':'answered-wrong');
  if(ok)score++;else wrong++;
  answered++;updateSticky();
  checkDone();
}

function checkDone(){
  if(answered===totalQ){
    document.getElementById('submitBtn').disabled=false;
    setTimeout(()=>document.getElementById('submitBtn').scrollIntoView({behavior:'smooth',block:'center'}),400);
  }
}

function updateSticky(){
  const t=totalQ||questions.length,pct=answered>0?Math.round(score/answered*100):0;
  document.getElementById('sNum').textContent=answered+'/'+t+' أجبت';
  document.getElementById('sC').textContent='✅ '+score;
  document.getElementById('sW').textContent='❌ '+wrong;
  document.getElementById('sP').textContent='📊 '+pct+'%';
  document.getElementById('sFill').style.width=(t>0?Math.round(answered/t*100):0)+'%';
}

function showResults(){
  const t=totalQ,pct=Math.round(score/t*100);
  document.getElementById('rScore').textContent=score;
  document.getElementById('rTotal').textContent=t;
  document.getElementById('rC').textContent=score;
  document.getElementById('rW').textContent=wrong;
  document.getElementById('rP').textContent=pct+'%';
  document.getElementById('ringFg').style.strokeDashoffset=402;
  setTimeout(()=>{document.getElementById('ringFg').style.strokeDashoffset=402-(402*pct/100);},100);
  document.getElementById('rMsg').textContent=pct>=90?'🌟 Excellent! أنت متقن!':pct>=75?'👏 Very Good! مجهود رائع!':pct>=60?'👍 Good! راجع الغلط!':'📚 تحتاج مراجعة — إنت قادر!';
  const rev=document.getElementById('reviewDiv');rev.innerHTML='<h3>📋 مراجعة الإجابات الغلط</h3>';
  let hw=false;
  questions.forEach((q,i)=>{
    const card=document.getElementById('card-mcq-'+i);
    if(card&&card.classList.contains('answered-wrong')){
      hw=true;
      rev.innerHTML+='<div class="rev-item wrong"><div class="rt">❌ Q'+q.n+': '+esc(q.q)+'</div><div>✅ الإجابة الصحيحة: <strong>'+esc(q.opts[q.c])+'</strong></div><div class="exp">'+esc(q.exp)+'</div></div>';
    }
  });
  tfQuestions.forEach((t,ti)=>{
    const card=document.getElementById('card-tf-'+ti);
    if(card&&card.classList.contains('answered-wrong')){
      hw=true;
      rev.innerHTML+='<div class="rev-item wrong"><div class="rt">❌ T/F: '+esc(t.stmt)+'</div><div>✅ الإجابة الصحيحة: <strong>'+(t.ans?'True ✅':'False ❌')+'</strong></div>'+(t.fix?'<div class="exp">التصحيح: '+esc(t.fix)+'</div>':'')+'</div>';
    }
  });
  if(!hw)rev.innerHTML='<p style="color:#10b981;text-align:center;padding:24px;font-size:1.1em;">🎉 كل إجاباتك صح! ممتاز!</p>';
  document.getElementById('resultsBox').style.display='block';
  document.getElementById('resultsBox').scrollIntoView({behavior:'smooth'});
}
function goHome(){
  document.getElementById('quizWrapper').style.display='none';
  document.getElementById('stickyBar').style.display='none';
  document.getElementById('startScreen').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
window.onload=()=>{let tfTotal=0;ORDER.forEach(cat=>{if(TF[cat])tfTotal+=TF[cat].rows.length;});document.getElementById('qCount').textContent=ALL.length+(tfTotal?' MCQ + '+tfTotal+' T/F':'');};
</script>
